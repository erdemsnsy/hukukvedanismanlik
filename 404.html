<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Sayfa Bulunamadı - Şensoy Hukuk ve Danışmanlık</title>
    <meta name="description" content="Aradığınız sayfa bulunamadı. Lütfen ana sayfaya dönün.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo-statue.png">
    <style>
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background: radial-gradient(circle at center, rgba(18, 18, 26, 0.95) 0%, rgba(10, 10, 15, 1) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .error-content {
            position: relative;
            z-index: 10;
            max-width: 600px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #d4a84b 0%, #f0d68a 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--white);
        }
        .error-desc {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .error-icon {
            font-size: 3rem;
            animation: floatGavel 3s ease-in-out infinite;
        }
        @keyframes floatGavel {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(-10deg); }
        }
    </style>
</head>
<body>
    <!-- Floating Particles Background -->
    <div class="particles" id="particles"></div>

    <div class="error-page">
        <div class="error-content">
            <div class="error-icon">⚖️</div>
            <div class="error-code">404</div>
            <h1 class="error-title">Sayfa Bulunamadı</h1>
            <p class="error-desc">Aradığınız sayfa kaldırılmış, adı değiştirilmiş veya geçici olarak kullanım dışı olabilir. Lütfen ana sayfaya dönüp oradan devam edin.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Ana Sayfaya Dön
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
